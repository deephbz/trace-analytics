# Publish the inference-physics explainer. index.html is built locally by
# research/inference-physics/build.py from page.html and the numeric benchmark.json.
name: pages
on:
  push:
    branches: [main]
    paths: [research/inference-physics/index.html, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir site && cp research/inference-physics/index.html site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
